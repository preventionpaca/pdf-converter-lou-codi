name: Construire les paquets Lou Còdi Workshop

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,packaging]"
      - run: python -m pytest -q
      - run: python -m PyInstaller -y --clean packaging/standalone/lou-codi-pdf-converter.spec
        env:
          LOU_CODI_BUNDLE_SPEECH: "0"
      - if: runner.os == 'Linux'
        run: bash packaging/linux/make-bundle.sh
      - if: runner.os == 'Linux'
        run: bash packaging/linux/make-deb.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          [void][scriptblock]::Create(
            (Get-Content packaging/windows/install.ps1 -Raw)
          )
      - if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/make-bundle.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = python -c "import sys; sys.path.insert(0, r'${{ github.workspace }}\src'); from lou_codi_pdf_converter import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$Version" "/DProjectDir=${{ github.workspace }}" packaging/windows/lou-codi-workshop.iss
      - uses: actions/upload-artifact@v4
        with:
          name: lou-codi-workshop-${{ matrix.artifact }}
          path: dist/installers/*
