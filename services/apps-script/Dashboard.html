<!doctype html>
<html lang="fr">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{font-family:system-ui,sans-serif;color:#16355c;background:#eef5fa}body{margin:0;padding:24px}
    main{max-width:1100px;margin:auto}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    input,button{font:inherit;padding:10px 12px;border-radius:7px;border:1px solid #aac0d4}
    button{background:#12478b;color:white;border:0;font-weight:700;cursor:pointer}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}
    .card,table{background:white;border-radius:12px;box-shadow:0 5px 18px #16355c18}.card{padding:18px}
    .value{font-size:2rem;font-weight:800;color:#d71920}table{width:100%;border-collapse:collapse;overflow:hidden}
    th,td{text-align:left;padding:10px;border-bottom:1px solid #dde7ef}#error{color:#b00020;font-weight:700}
  </style>
</head>
<body><main>
  <h1>Licences et statistiques Lou Còdi</h1>
  <div class="bar"><input id="password" type="password" placeholder="Mot de passe administrateur"><button onclick="loadDashboard()">Afficher</button><span id="error"></span></div>
  <section id="content" hidden><div class="cards" id="cards"></div><h2>Licences récentes</h2><table><thead><tr><th>Clé</th><th>E-mail</th><th>Statut</th><th>Créée le</th></tr></thead><tbody id="licenses"></tbody></table></section>
  <script>
    function loadDashboard(){
      error.textContent='';
      google.script.run.withSuccessHandler(render).withFailureHandler(e=>error.textContent=e.message)
        .adminSnapshot(password.value);
    }
    function render(data){
      content.hidden=false;
      cards.innerHTML=[['Licences',data.licenses],['Postes actifs',data.active_installations],['Événements',data.events]]
        .map(x=>`<div class="card"><div>${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');
      licenses.innerHTML=data.recent_licenses.map(x=>`<tr><td>${esc(x.key)}</td><td>${esc(x.email)}</td><td>${esc(x.status)}</td><td>${esc(x.created)}</td></tr>`).join('');
    }
    function esc(value){const node=document.createElement('span');node.textContent=value;return node.innerHTML}
  </script>
</main></body></html>
