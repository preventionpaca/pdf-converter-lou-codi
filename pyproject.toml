[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lou-codi-pdf-converter"
version = "2.0.0a11"
description = "Convertir, organiser et personnaliser des PDF localement."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Lou Còdi"}]
dependencies = [
  "pypdf>=5.0,<7",
  "pdfplumber>=0.11,<0.12",
  "pdf2docx>=0.5.8,<0.6",
  "PyMuPDF>=1.26,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "reportlab>=4,<5",
  "arabic-reshaper>=3,<4",
  "python-bidi>=0.6,<1",
  "python-docx>=1.1,<2",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]
packaging = ["pyinstaller>=6,<7", "pip-licenses>=5,<6"]

[project.scripts]
lou-codi-pdf-converter = "lou_codi_pdf_converter.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lou_codi_pdf_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
